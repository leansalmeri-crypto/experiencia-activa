<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administración · Experiencia Activa</title><style>body{font-family:Arial,sans-serif;margin:0;background:#f6f3ee;color:#132238}.wrap{max-width:980px;margin:auto;padding:20px}.card{background:#fff;border-radius:18px;padding:20px;margin:16px 0;box-shadow:0 4px 20px #0001}input{width:100%;padding:12px;margin:7px 0 13px;border:1px solid #ccd3db;border-radius:10px;box-sizing:border-box}.btn{display:inline-block;background:#ef7d32;color:#fff;border:0;border-radius:12px;padding:12px 16px;font-weight:700;text-decoration:none;cursor:pointer}.ghost{background:#fff;color:#0d2747;border:1px solid #ccd3db}.hidden{display:none}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.stat{background:#eef4fa;border-radius:14px;padding:16px}.stat b{font-size:25px}.item{border-top:1px solid #eee;padding:12px 0}.muted{color:#667085}.bad{background:#fff0f0;padding:12px;border-radius:10px}.ok{background:#e9f8ef;padding:12px;border-radius:10px}header{background:#0d2747;color:#fff;padding:16px;font-weight:800}.actions{display:flex;gap:8px;flex-wrap:wrap}.search{margin-top:12px}</style></head><body><header>EA · Panel Administrador</header><main class="wrap"><section id="login" class="card"><h2>Acceso administrador</h2><p class="muted">Acceso privado de Experiencia Activa.</p><form id="form"><input id="email" type="email" placeholder="Correo" required><input id="password" type="password" placeholder="Contraseña" required><button class="btn">Ingresar</button></form><div id="msg"></div></section><section id="panel" class="hidden"><div class="card"><h2>Resumen general</h2><div class="grid"><div class="stat"><b id="workers">0</b><br>Trabajadores</div><div class="stat"><b id="companies">0</b><br>Empresas</div><div class="stat"><b id="jobs">0</b><br>Búsquedas</div><div class="stat"><b id="apps">0</b><br>Postulaciones</div></div><div class="actions" style="margin-top:16px"><button id="refresh" class="btn">Actualizar datos</button><a class="btn ghost" href="/">Abrir aplicación</a><button id="logout" class="btn ghost">Cerrar sesión</button></div><div id="status"></div></div><div class="card"><h2>Búsquedas publicadas</h2><input id="jobFilter" class="search" placeholder="Buscar por puesto, empresa o correo"><div id="jobList">Cargando…</div></div><div class="card"><h2>Postulaciones</h2><div id="appList">Cargando…</div></div><div class="card"><h2>Usuarios registrados</h2><input id="profileFilter" class="search" placeholder="Buscar por nombre, empresa o correo"><div id="profileList">Cargando…</div></div></section></main><script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js';import{getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged}from'https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js';import{getFirestore,collection,getDocs}from'https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js';const cfg={apiKey:'AIzaSyAmltMCMtu3v43AccqxE6XoHcmwtfYAuK0',authDomain:'experiencia-activa.firebaseapp.com',projectId:'experiencia-activa',storageBucket:'experiencia-activa.firebasestorage.app',messagingSenderId:'990398387247',appId:'1:990398387247:web:5d10ff9d30eb7244fc22da'};const app=initializeApp(cfg),auth=getAuth(app),db=getFirestore(app);const ADMIN='experienciaactiva.arg@gmail.com',esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let PS=[],JS=[],AS=[];function render(){const pf=profileFilter.value.trim().toLowerCase(),jf=jobFilter.value.trim().toLowerCase();const ps=PS.filter(x=>`${x.name||''} ${x.companyName||''} ${x.email||''} ${x.zone||''}`.toLowerCase().includes(pf));const js=JS.filter(x=>`${x.title||''} ${x.company||''} ${x.companyEmail||''} ${x.zone||''}`.toLowerCase().includes(jf));profileList.innerHTML=ps.length?ps.map(x=>`<div class="item"><b>${esc(x.role==='company'?x.companyName:x.name)}</b> · ${esc(x.role||'')}<br><span class="muted">${esc(x.email||'')} · ${esc(x.zone||'')} · ID ${esc(x.id)}</span></div>`).join(''):'No hay coincidencias.';jobList.innerHTML=js.length?js.map(x=>`<div class="item"><b>${esc(x.title||'Búsqueda')}</b> · ${esc(x.company||'')}<br><span class="muted">${esc(x.zone||'')} · ${esc(x.modality||'')} · ${x.active===false?'Inactiva':'Activa'} · ID ${esc(x.id)}</span><p>${esc(x.description||'')}</p></div>`).join(''):'No hay búsquedas guardadas.';const jm=Object.fromEntries(JS.map(x=>[x.id,x])),pm=Object.fromEntries(PS.map(x=>[x.id,x]));appList.innerHTML=AS.length?AS.map(x=>{const j=jm[x.jobId]||{},p=pm[x.userId]||{};return `<div class="item"><b>${esc(p.name||'Candidato')}</b> → ${esc(j.title||'Búsqueda no encontrada')}<br><span class="muted">${esc(p.email||'')} · Estado: ${esc(x.status||'enviada')} · ID ${esc(x.id)}</span></div>`}).join(''):'Todavía no hay postulaciones.'}async function load(){status.innerHTML='<p class="muted">Actualizando…</p>';try{const[p,j,a]=await Promise.all([getDocs(collection(db,'profiles')),getDocs(collection(db,'jobs')),getDocs(collection(db,'applications'))]);PS=p.docs.map(d=>({id:d.id,...d.data()}));JS=j.docs.map(d=>({id:d.id,...d.data()}));AS=a.docs.map(d=>({id:d.id,...d.data()}));JS.sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));workers.textContent=PS.filter(x=>x.role==='worker').length;companies.textContent=PS.filter(x=>x.role==='company').length;jobs.textContent=JS.length;apps.textContent=AS.length;render();status.innerHTML='<p class="ok">Datos sincronizados con Firebase.</p>'}catch(e){status.innerHTML='<p class="bad">No se pudieron leer todos los datos. Revisar permisos de Firestore.</p>';jobList.innerHTML=profileList.innerHTML=appList.innerHTML='<div class="bad">Lectura bloqueada por Firestore.</div>'}}form.onsubmit=async e=>{e.preventDefault();msg.textContent='';try{const c=await signInWithEmailAndPassword(auth,email.value.trim(),password.value);if(c.user.email?.toLowerCase()!==ADMIN){await signOut(auth);throw new Error('Acceso no autorizado')}await load()}catch(e){msg.innerHTML='<p class="bad">No se pudo ingresar como administrador.</p>'}};onAuthStateChanged(auth,async u=>{const ok=u&&u.email?.toLowerCase()===ADMIN;login.classList.toggle('hidden',ok);panel.classList.toggle('hidden',!ok);if(ok)await load()});refresh.onclick=load;logout.onclick=()=>signOut(auth);profileFilter.oninput=render;jobFilter.oninput=render;</script></body></html>
